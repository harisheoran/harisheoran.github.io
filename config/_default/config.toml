title = "Harish Sheoran"
theme = "blowfish"

baseURL = "https://harisheoran.github.io/"
defaultContentLanguage = "en"

colorScheme = "blowfish"
topic = "topics"

# pluralizeListTitles = "true" # hugo function useful for non-english languages, find out more in  https://gohugo.io/getting-started/configuration/#pluralizelisttitles

enableRobotsTXT = true
summaryLength = 0

buildDrafts = false
buildFuture = false

# Notes arrive from Obsidian via Enveloppe. If a note carries no `date:`,
# fall back to its git history rather than file mtime -- on CI every file
# is checked out "now", so :fileModTime would date every note today.
# The CI checkout already uses fetch-depth: 0, which :git needs.
enableGitInfo = true

[frontmatter]
  date = ["date", "publishDate", ":git", "lastmod", ":default"]
  lastmod = ["lastmod", ":git", "date", "publishDate"]

googleAnalytics = "G-5TXFZLWMBX"

[pagination]
  pagerSize = 100

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 100

    [[related.indices]]
        name = "series"
        weight = 50

    [[related.indices]]
        name = "authors"
        weight = 20

    [[related.indices]]
        name = "date"
        weight = 10

    [[related.indices]]
      applyFilter = false
      name = 'fragmentrefs'
      type = 'fragments'
      weight = 10

# Comments (giscus) are opt-in per section rather than site-wide: they belong
# on writing, not on Resume or Contact. Kept here instead of in each section's
# _index.md so the whole policy is readable in one place -- and so blogs/ and
# projects/, which have no _index.md, do not need one invented for a flag.
# Blowfish reads .Params.showComments in partials/article-comments.html.
[[cascade]]
  [cascade.params]
    showComments = true
  [cascade.target]
    path = '{/blogs/**,/notes/**,/projects/**}'
